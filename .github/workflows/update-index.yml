name: Update Index

on:
  push:
    branches: [ main ]
    paths:
      - '**.tgz'

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Helm Installation
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.17.0
      - name: Update Index
        run: |
          helm repo index .
          git config --global user.email "autodev.oct@gmail.com"
          git config --global user.name "octubre-bot"
          git add index.yaml
          git commit -m "Update chart index"
          git push
